spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:./database/data;AUTO_SERVER=TRUE
    username: ${TEAMNAV_H2_USERNAME:sa}
    password: ${TEAMNAV_H2_PASSWORD:123456}
  h2:
    console:
      enabled: ${TEAMNAV_H2_CONSOLE_ENABLED:false}
      settings:
        web-allow-others: ${TEAMNAV_H2_CONSOLE_ALLOW_REMOTE:false}
  jpa:
    database: h2
  sql:
    init:
      schema-locations: classpath:sql/schema.sql
      mode: always
